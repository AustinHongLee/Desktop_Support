[package]
name = "desktop-support-tauri-spike"
version = "0.1.0"
description = "Experimental Tauri shell for Desktop Support."
authors = ["AustinHongLee"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
